apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fault-quarantine.fullname" . }}-gpu-recheck
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fault-quarantine.fullname" . }}-gpu-recheck
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fault-quarantine.fullname" . }}-gpu-recheck
subjects:
  - kind: ServiceAccount
    name: {{ include "fault-quarantine.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
